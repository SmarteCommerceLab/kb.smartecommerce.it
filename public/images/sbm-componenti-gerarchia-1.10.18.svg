    <g transform="translate(694 138)"><rect width="294" height="94" rx="6" fill="#f7f8fa" stroke="#d6d9dd"/><rect x="18" y="21" width="48" height="48" rx="6" fill="#2276b8"/><text x="84" y="42" font-size="12" fill="#56616d">DISABILITATI</text><text x="84" y="70" font-size="24" font-weight="700" fill="#18212b">1</text></g>
    <g transform="translate(1006 138)"><rect width="294" height="94" rx="6" fill="#f7f8fa" stroke="#d6d9dd"/><rect x="18" y="21" width="48" height="48" rx="6" fill="#2276b8"/><text x="84" y="42" font-size="12" fill="#56616d">BACKUP</text><text x="84" y="70" font-size="24" font-weight="700" fill="#18212b">3</text></g>
